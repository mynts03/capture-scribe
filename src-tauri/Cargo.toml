[package]
name = "capture-scribe-studio"
version = "0.1.0"
description = "Local screen recording, processing, and transcription studio"
edition = "2021"
rust-version = "1.89"
default-run = "capture-scribe-studio"

[lib]
name = "capture_scribe_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
tauri = { version = "2", features = [] }
sha2 = "0.10.9"
getrandom = "0.3.4"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[[bin]]
name = "capture-scribe-control"
path = "src/bin/capture-scribe-control.rs"
